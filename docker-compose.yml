services:
  db:
    image: mysql:8.4
    container_name: helios-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-helios}
      MYSQL_USER: ${DB_USERNAME:-helios}
      MYSQL_PASSWORD: ${DB_PASSWORD:-helios}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: helios-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-helios}
      DB_USERNAME: ${DB_USERNAME:-helios}
      DB_PASSWORD: ${DB_PASSWORD:-helios}
      HELIOS_JWT_SECRET: ${HELIOS_JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      HELIOS_CORS_ORIGINS: ${HELIOS_CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hellodoctor.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_SAMPLE_ENABLED: ${SEED_SAMPLE_ENABLED:-true}
      # Email (SMTP). Set MAIL_ENABLED=true and provide host/credentials to send real email.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@hellodoctor.local}
      # SMS. provider=log (default) or twilio (requires the TWILIO_* values below).
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: helios-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db_data:
