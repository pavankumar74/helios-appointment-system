# ==== Test profile: in-memory H2 (MySQL-compatible mode) ====
spring.datasource.url=jdbc:h2:mem:helios;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# Match production: fail fast on lazy access outside a transaction.
spring.jpa.open-in-view=false

# Deterministic test secret (32+ bytes, base64).
helios.security.jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtMzItYnl0ZXMtbG9uZyE=
helios.security.jwt.expiration-ms=3600000

# Keep tests hermetic: no seeded admin, notifications logged only.
helios.seed.admin.enabled=false
helios.notifications.mail.enabled=false
helios.notifications.sms.provider=log
helios.security.cors.allowed-origins=http://localhost:5173

# JavaMailSender autoconfig needs a host (not actually contacted when mail disabled).
spring.mail.host=localhost
spring.mail.port=1025
