spring.application.name=helios

# ==== Server ====
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==== Database (MySQL) ====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helios}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:helios}
spring.datasource.password=${DB_PASSWORD:helios}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ==== JWT ====
# NOTE: Override HELIOS_JWT_SECRET in production with a strong, random 256-bit (base64) secret.
helios.security.jwt.secret=${HELIOS_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
helios.security.jwt.expiration-ms=${HELIOS_JWT_EXPIRATION_MS:86400000}

# ==== CORS (frontend) ====
helios.security.cors.allowed-origins=${HELIOS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==== Mail (async notifications). Values are placeholders for local dev. ====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
helios.notifications.mail.from=${MAIL_FROM:no-reply@hellodoctor.local}
# When false, notifications are logged instead of actually sent (safe for local dev).
helios.notifications.mail.enabled=${MAIL_ENABLED:false}

# ==== SMS notifications ====
# provider: "log" (default, logs only) or "twilio" (real delivery via Twilio REST API).
helios.notifications.sms.provider=${SMS_PROVIDER:log}
helios.notifications.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
helios.notifications.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
helios.notifications.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ==== Actuator ====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ==== Seed default admin (dev convenience) ====
helios.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
helios.seed.admin.email=${SEED_ADMIN_EMAIL:admin@hellodoctor.local}
helios.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@12345}
# Seed sample doctors, patients, and appointments (only when admin seeding is enabled).
helios.seed.sample.enabled=${SEED_SAMPLE_ENABLED:true}
