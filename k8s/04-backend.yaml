apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: helios
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: helios
spec:
  replicas: 2                     # stateless JWT API — safe to scale horizontally
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: helios
    spec:
      # Wait for MySQL to accept connections before starting the app.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"
      containers:
        - name: backend
          image: helios-backend:latest
          imagePullPolicy: IfNotPresent   # for local kind/minikube loaded images
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          # Use the aggregate /actuator/health endpoint (always present) for all probes.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 40
            periodSeconds: 5           # allow up to ~200s for first boot
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend            # name MUST stay "backend" — the frontend nginx proxies to http://backend:8080
  namespace: helios
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: helios
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
