# Database credentials. In production, do NOT commit real values —
# create this Secret with `kubectl create secret` or a sealed-secret / external secrets operator.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: helios
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: helios
type: Opaque
stringData:
  MYSQL_DATABASE: helios
  MYSQL_USER: helios
  MYSQL_PASSWORD: helios
  MYSQL_ROOT_PASSWORD: rootpass
